<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hip Gun Time Tracker</title>
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Time Tracker">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Direkt aus dem Dropbox-Ordner geöffnet (file://): Browser blockieren dort die App-Module,
    // also zur Online-Version weiterleiten.
    if (location.protocol === 'file:') {
      location.replace('https://bundb-app.github.io/Hip-Gun-Time-Tracker/' + location.hash);
    }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="assets/logo.png" alt="" class="brand-logo">
      <span class="brand-title">Time Tracker</span>
    </div>
    <button id="sync-pill" class="sync-pill" type="button" title="Jetzt synchronisieren">
      <span class="dot"></span><span class="label">…</span>
    </button>
  </header>

  <nav class="tabs" id="tabs">
    <button data-view="erfassen" class="active">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Erfassen</span>
    </button>
    <button data-view="kunden">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Kunden</span>
    </button>
    <button data-view="pdf">
      <svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/></svg><span>Stundenzettel</span>
    </button>
    <button data-view="einstellungen">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>Einstellungen</span>
    </button>
  </nav>

  <main id="main"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/jspdf.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
  <script>
    // Falls die App nicht startet, nicht stumm bleiben, sondern einen Hinweis zeigen
    setTimeout(function () {
      if (window.__appReady) return;
      document.getElementById('main').innerHTML =
        '<div class="card"><h2>App konnte nicht gestartet werden</h2>' +
        '<p>Bitte die Seite neu laden. Hilft das nicht, die App über diese Adresse öffnen:</p>' +
        '<p><a href="https://bundb-app.github.io/Hip-Gun-Time-Tracker/">bundb-app.github.io/Hip-Gun-Time-Tracker</a></p>' +
        '<p class="hint">Ein aktueller Browser (Safari, Chrome, Firefox) wird benötigt.</p></div>';
    }, 4000);
  </script>
</body>
</html>
